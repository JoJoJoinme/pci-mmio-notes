[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qman-directpath-core"
version = "0.1.0"
description = "Portable fail-closed trust and capability core for Qman DirectPath V3"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42.0.0,<48",
  "jsonschema>=4.22,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-subtests>=0.13,<1",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["qman_directpath_core*"]
