[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qman-directpath-reference"
version = "0.4.0"
description = "SQLite reference transactions for Static admission, DirectPath queries, and HostSnapshot publication"
requires-python = ">=3.10"
dependencies = ["qman-directpath-core==0.1.0"]

[project.optional-dependencies]
test = ["jsonschema>=4.23,<5", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qman_directpath_reference*"]
